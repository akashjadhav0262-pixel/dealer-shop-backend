spring.application.name=dealer-shop-backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dealershop}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health

# JWT: the secret comes from an environment variable, with no default on purpose
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7